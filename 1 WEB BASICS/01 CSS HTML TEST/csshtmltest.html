<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
        }

        .box {
            width: 460px;
            height: 300px;
            background-color: blue;
            margin-top: 20px;
            margin-left: 20px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            color: white;
        }

        .box h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
        }

        .box ul {
            margin: 0;
            padding-left: 20px;
        }

        .box li {
            margin-bottom: 5px;
        }

        .orange-box {
            width: 160px;
            height: 100px;
            background-color: orange;
            position: absolute;
            right: 0px;
            bottom: 0px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Willkommen!</h1>

        <ul>
            <li>eins</li>
            <li>zwei</li>
            <li>drei</li>
        </ul>

        <div class="orange-box"></div>
    </div>
</body>

</html>
